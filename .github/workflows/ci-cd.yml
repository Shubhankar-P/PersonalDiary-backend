name: Spring Boot CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: diary_db
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: diarydb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Create test configuration
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application-test.yml << 'EOF'
          spring:
            datasource:
              url: jdbc:postgresql://localhost:5432/diarydb_test
              username: diary_db
              password: test_password
            jpa:
              hibernate:
                ddl-auto: validate
              properties:
                hibernate:
                  dialect: org.hibernate.dialect.PostgreSQLDialect
            flyway:
              enabled: true
              locations: classpath:db/migration

          server:
            port: 8085
            servlet:
              context-path: /diary

          jwt:
            secret: dGVzdC1vbmx5LWNpLWp3dC1zZWNyZXQtbm90LWZvci1wcm9kLXVzZQ==
            access-expiry-ms: 900000
          
          logging:
            level:
              org.flywaydb: DEBUG
          EOF

      - name: Build with Maven and run tests
        run: mvn clean verify

      - name: Debug - list migration files
        if: always()
        run: find target/classes -name "*.sql" || echo "no sql files found"

      - name: Build Docker image
        run: docker build -t diary-backend .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: target/site/jacoco/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}