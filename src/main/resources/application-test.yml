spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/diarydb_test
    username: diary_db
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: WARN

jwt:
  secret: test-only-secret-for-junit-tests

server:
  port: 8085
  servlet:
    context-path: /diary